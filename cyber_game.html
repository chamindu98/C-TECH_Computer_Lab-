<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuest: 50 Code Kingdoms - Advanced Routing Edition</title>
    <style>
        :root {
            --bg-dark: #060913;
            --panel-bg: #0d1527;
            --neon-cyan: #00fff5;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fffb00;
            --border-color: #1e293b;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: linear-gradient(rgba(0, 255, 245, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 245, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        #game-container {
            text-align: center;
            background: rgba(13, 21, 39, 0.85);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 245, 0.1);
            border: 2px solid rgba(0, 255, 245, 0.2);
            backdrop-filter: blur(12px);
            width: 860px;
        }

        h1 {
            margin: 0 0 5px 0;
            color: var(--neon-cyan);
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 245, 0.5);
            font-weight: 800;
        }

        .sub-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* HUD Matrix */
        #info-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            gap: 15px;
        }
        
        .stat-box {
            background: #090f1e;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        #level-title { color: var(--neon-yellow); }
        #score-display { color: var(--neon-green); }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: #090f1e;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar {
            height: 100%;
            width: 2%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        /* Question Console */
        #question-box {
            width: 100%;
            font-size: 17px;
            margin-bottom: 20px;
            background: #050811;
            padding: 18px;
            border-radius: 12px;
            border-left: 5px solid var(--neon-pink);
            text-align: left;
            line-height: 1.6;
            min-height: 70px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }

        #question-text {
            color: #e2e8f0;
        }

        canvas {
            border: 2px solid rgba(0, 255, 245, 0.3);
            background: #03060f;
            border-radius: 14px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            display: block;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🤖 CYBERQUEST: 50 CODE KINGDOMS</h1>
    <div class="sub-title">Advanced Data Packet Routing Terminal</div>
    
    <div id="info-panel">
        <div class="stat-box">NETWORK NODE: <span id="level-title">1 / 50</span></div>
        <div class="stat-box">ROUTED PACKETS (SCORE): <span id="score-display">0</span></div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="game-progress"></div>
    </div>

    <div id="question-box">
        <strong style="color: var(--neon-pink);">⚡ DATAPACKET INSPECTION:</strong> <span id="question-text">Loading secure gateway protocols...</span>
    </div>

    <canvas id="gameCanvas" width="810" height="420"></canvas>
    
    <div class="controls-hint">🎮 CONTROL ENGINE: Use ARROW KEYS or W, A, S, D to route the Neon Packet. Avoid Firewalls (Red Walls)!</div>
</div>

        { title: "2/50 - Output Engine", question: "පරිගණකයෙන් සකස් කළ තොරතුරු බාහිරට ලබා දෙන Output Device එකක් වන්නේ?", answers: [{ text: "A. Printer (මුද්‍රණ යන්ත්‍රය)", isCorrect: true, x: 540, y: 70 }, { text: "B. Microphone (මයික්‍රෆෝනය)", isCorrect: false, x: 540, y: 280 }] },
        { title: "3/50 - The Brain of Computer", question: "පරිගණකයේ සියලුම ගණනය කිරීම් සහ පාලනයන් සිදු කරන ප්‍රධාන මොළය කුමක්ද?", answers: [{ text: "A. RAM", isCorrect: false, x: 540, y: 70 }, { text: "B. CPU (මධ්‍ය සැකසුම් ඒකකය)", isCorrect: true, x: 540, y: 280 }] },
        { title: "4/50 - Storage Hub", question: "පරිගණකයේ දත්ත සහ මෘදුකාංග ස්ථිරවම තැන්පත් කර තබන ප්‍රධාන ද්විතීයික ගබඩාව?", answers: [{ text: "A. Hard Disk Drive (HDD)", isCorrect: true, x: 540, y: 70 }, { text: "B. RAM", isCorrect: false, x: 540, y: 280 }] },

    window.addEventListener("keydown", e => { keys[e.code] = true; });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    // Generate Dynamic Obstacle Maze Patterns based on level number
    function generatePathHazards(levelIdx) {
        obstacles = [];
        routers = [];
        let difficulty = Math.min(Math.floor(levelIdx / 5) + 2, 7); // Increases walls with levels

        // Always build a safe path framework around starting node
        // Let's add vertical segment gates inside center arena
        for (let i = 0; i < difficulty; i++) {
            let wallX = 180 + (i * 45);
            let h = 130 + Math.random() * 110;
            let wallY = (i % 2 === 0) ? 0 : canvas.height - h;
            
            obstacles.push({ x: wallX, y: wallY, width: 14, height: h });
        }

        // Add Decorative Cyber Routers/Nodes that pulse
        for (let i = 0; i < difficulty - 1; i++) {
            routers.push({
                x: 200 + (i * 55),
                y: 100 + Math.random() * 200,
                radius: 6,
                pulse: Math.random() * Math.PI
            });
        }
    }

    function initLevel() {
        keys = {}; 
        if (currentLevel >= levelsData.length) {
            alert("🏆 CONGRATULATIONS! ඔයා CyberQuest මට්ටම් 50ම සාර්ථකව නිමකර මහා සයිබර් ජාල අධිපති බවට පත්වුණා! 💎");
            currentLevel = 0; 
            score = 0;
        }
        
        document.getElementById("level-title").innerText = `${currentLevel + 1} / 50`;
        document.getElementById("question-text").innerText = levelsData[currentLevel].question;
        document.getElementById("score-display").innerText = score;
        
        // Progress update
        let progPercent = ((currentLevel + 1) / levelsData.length) * 100;
        document.getElementById("game-progress").style.width = `${progPercent}%`;

        // Reset Data packet location
        player.x = 40;
        player.y = 200;

        // Build unique path complexity map
        generatePathHazards(currentLevel);
    }

    function checkCollision(rect1, rect2, rect2Width = 240, rect2Height = 80) {
        return rect1.x < rect2.x + rect2Width && 
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2Height && 
               rect1.y + rect1.height > rect2.y;
    }

    function triggerSuccessParticles(x, y) {
        for(let i=0; i<30; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                size: Math.random() * 4 + 2,
                color: "#39ff14",
                alpha: 1
            });
        }
    }

    function update() {
        let prevX = player.x;
        let prevY = player.y;

        // Handle Input Controllers
        if ((keys["ArrowUp"] || keys["KeyW"]) && player.y > 10) player.y -= player.speed;
        if ((keys["ArrowDown"] || keys["KeyS"]) && player.y < canvas.height - player.height - 10) player.y += player.speed;
        if ((keys["ArrowLeft"] || keys["KeyA"]) && player.x > 10) player.x -= player.speed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && player.x < canvas.width - player.width - 10) player.x += player.speed;

        // Packet Trail Particles
        if(Math.random() < 0.4) {
            particles.push({
                x: player.x + player.width/2,
                y: player.y + player.height/2,
                vx: (Math.random() - 0.8) * 2,
                vy: (Math.random() - 0.5) * 2,
                size: Math.random() * 3 + 1,
                color: "#00fff5",
                alpha: 0.8
            });
        }

        // Firewall Wall Collision Logic (Restricts pathway traversal)
        for (let wall of obstacles) {
            if (checkCollision(player, wall, wall.width, wall.height)) {
                // Flash packet warning reset
                player.x = 40;
                player.y = 200;
                keys = {};
                return;
            }
        }

        // Evaluate Answer Block Collision Metrics
        let lvl = levelsData[currentLevel];
        for (let ans of lvl.answers) {
            if (checkCollision(player, ans, 240, 80)) {
                if (ans.isCorrect) {
                    score += 10;
                    triggerSuccessParticles(player.x, player.y);
                    currentLevel++;
                    setTimeout(() => { initLevel(); }, 300);
                } else {
                    score = Math.max(0, score - 5); 
                    player.x = 40; 
                    player.y = 200;
                    keys = {};
                    document.getElementById("score-display").innerText = score;
                }
                break;
            }
        }

        // Update active background particle matrix arrays
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;
            if(p.alpha <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Clear frame grid canvas
        ctx.fillStyle = "#040814";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid Lines Overlay Matrix
        ctx.strokeStyle = "rgba(0, 255, 245, 0.03)";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 30) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = 0; j < canvas.height; j += 30) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        // Draw Network Firewall Barriers (Red Neon Barriers)
        obstacles.forEach(wall => {
            ctx.fillStyle = "rgba(255, 0, 127, 0.15)";
            ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            ctx.strokeStyle = "var(--neon-pink)";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "var(--neon-pink)";
            ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);
        });

        // Draw Cyber Router Nodes (Intermediary Network Nodes)
        routers.forEach(node => {
            node.pulse += 0.05;
            let rPulse = node.radius + Math.sin(node.pulse) * 4;
            ctx.beginPath();
            ctx.arc(node.x, node.y, rPulse, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 255, 245, 0.2)";
            ctx.fill();
            ctx.strokeStyle = "var(--neon-cyan)";
            ctx.lineWidth = 1;
            ctx.stroke();
        });
        ctx.shadowBlur = 0; // Reset blur

        // Draw Trails/Sparks
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.restore();
        });

        // Draw Data Packet Player (Neon Cyan Hyper Cube)
        ctx.fillStyle = "var(--neon-cyan)";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "var(--neon-cyan)";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        
        // Inner Core of Core Packet Data Layer
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, player.height - 8);
        ctx.shadowBlur = 0; // standard reset

        // Draw Answer Gate Arrays
        let lvl = levelsData[currentLevel];
        lvl.answers.forEach(ans => {
            // Main structure container box
            ctx.fillStyle = "#0a1124";
            ctx.strokeStyle = "rgba(0, 255, 245, 0.2)";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            
            ctx.fillRect(ans.x, ans.y, 240, 80);
            ctx.strokeRect(ans.x, ans.y, 240, 80);

            // Left Sidebar Terminal Indicator Tags
            ctx.fillStyle = ans.text.startsWith("A") ? "var(--neon-pink)" : "var(--neon-yellow)";
            ctx.fillRect(ans.x, ans.y, 6, 80);

            // Print Text Labels Wrap Configuration
            ctx.fillStyle = "#f8fafc";
            ctx.font = "bold 13px 'Segoe UI', system-ui, sans-serif";
            
            // Text Wrapping for long Sinhala descriptions inside standard gates
            let words = ans.text.split(" ");
            let line = "";
            let startY = ans.y + 32;
            
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + " ";
                let metrics = ctx.measureText(testLine);
                if (metrics.width > 210 && n > 0) {
                    ctx.fillText(line, ans.x + 16, startY);
                    line = words[n] + " ";
                    startY += 22;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, ans.x + 16, startY);
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Launch secure system nodes
    initLevel();
    gameLoop();
</script>
