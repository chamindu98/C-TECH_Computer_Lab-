<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-TECH - ICT Memory Match Game</title>
    <style>
        :root {
            --primary-blue: #004d80;
            --light-blue: #00a4e4;
            --orange: #ff7300;
            --dark-bg: #0b132b;
            --card-bg: #1c2541;
            --text-light: #f4f7f6;
            --success-green: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--dark-bg); color: var(--text-light);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 164, 228, 0.15) 0px, transparent 50%);
        }

        .web-container {
            width: 100%; max-width: 700px; background-color: rgba(28, 37, 65, 0.85);
            backdrop-filter: blur(10px); border: 2px solid var(--light-blue);
            border-radius: 16px; padding: 25px; box-shadow: 0 0 30px rgba(0, 164, 228, 0.3); text-align: center;
        }

        .game-title { font-size: 1.8rem; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px var(--light-blue); }
        .game-desc { color: #a0aec0; margin-bottom: 20px; font-size: 0.95rem; }

        .game-area {
            background-color: rgba(11, 19, 43, 0.6); border-radius: 12px; padding: 25px;
            border: 1px dashed rgba(0, 164, 228, 0.4); margin-bottom: 20px;
        }

        .game-stats {
            display: flex; justify-content: space-around; background: rgba(255,255,255,0.03);
            padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: bold;
        }
        .stat-highlight { color: var(--orange); }

        .memory-grid-arena { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }

        .mem-card { height: 90px; position: relative; transform-style: preserve-3d; transition: transform 0.4s; cursor: pointer; }
        .mem-card.flipped { transform: rotateY(180deg); }
        .mem-card.matched { animation: cardPulse 0.5s forwards; cursor: default; }
        
        .mem-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; justify-content: center; align-items: center; border-radius: 8px;
            border: 2px solid #2e3856; font-weight: bold;
        }
        .mem-front { background: radial-gradient(circle, #1c2541, #0b132b); color: var(--light-blue); font-size: 1.8rem; }
        .mem-back {
            background: #2e3856; color: #fff; transform: rotateY(180deg); border-color: var(--light-blue);
            display: flex; flex-direction: column; justify-content: center; padding: 5px;
        }
        .mem-back span { font-size: 2rem; }
        .mem-text-node { font-size: 0.85rem; color: #ffeb3b; line-height: 1.2; }

        .game-overlay-message { display: none; background: var(--card-bg); border: 2px solid var(--success-green); border-radius: 8px; padding: 20px; margin-bottom: 20px; }

        button {
            width: 100%; max-width: 250px; padding: 12px; background: linear-gradient(90deg, #008cd1, var(--light-blue));
            border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: linear-gradient(90deg, var(--light-blue), #00b4ff); box-shadow: 0 0 15px rgba(0, 164, 228, 0.4); }
        
        .back-link { display: inline-block; margin-top: 20px; color: var(--light-blue); text-decoration: none; font-weight: 600; }
        .back-link:hover { color: var(--orange); }

        @keyframes cardPulse {
            50% { transform: rotateY(180deg) scale(1.05); border-color: var(--success-green); }
            100% { transform: rotateY(180deg) scale(1); border-color: var(--success-green); opacity: 0.65; }
        }
        @media screen and (max-width: 500px) { .memory-grid-arena { grid-template-columns: repeat(3, 1fr); } .mem-card { height: 75px; } }
    </style>
</head>
<body>
    <div class="web-container">
        <h2 class="game-title">🧠 ICT Memory Match Master</h2>
        <p class="game-desc">IT විෂයට අදාළ සමාන පද සහ සංකේත යුගල නිවැරදිව තෝරා ගළපන්න.</p>
        
        <div class="game-area">
            <div class="game-stats">
                <div>Time: <span id="mem-timer" class="stat-highlight">00:00</span></div>
                <div>Flips: <span id="mem-moves" class="stat-highlight">0</span></div>
            </div>

            <div class="game-overlay-message" id="memWinBox">
                <p style="color: var(--success-green); font-weight: bold; font-size: 1.3rem; margin-bottom: 8px;">🎉 සුභ පැතුම්! ඔබට ජය!</p>
                <p id="memWinResult"></p>
            </div>

            <div class="memory-grid-arena" id="memGridArena"></div>
            <button onclick="resetMemoryGame()">Reset Game</button>
        </div>

        <a href="games.html" class="back-link">← වෙනත් ගේම් එකක් තෝරන්න</a>
    </div>

    <script>
        function playSound(freq, type, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        const memData = [
            { id: 1, type: 'pic', content: '💻' }, { id: 1, type: 'txt', content: 'Keyboard' },
            { id: 2, type: 'pic', content: '🖥️' }, { id: 2, type: 'txt', content: 'Monitor' },
            { id: 3, type: 'pic', content: '💾' }, { id: 3, type: 'txt', content: 'Hard Disk' },
            { id: 4, type: 'pic', content: '🖲️' }, { id: 4, type: 'txt', content: 'Processor' },
            { id: 5, type: 'pic', content: '🔌' }, { id: 5, type: 'txt', content: 'System Unit' },
            { id: 6, type: 'pic', content: '🌐' }, { id: 6, type: 'txt', content: 'Internet' }
        ];

        let memFlipped = []; let memMatched = 0; let memMoves = 0;
        let memTime = 0; let memTimerInterval = null; let memStarted = false; let memLock = false;

        function resetMemoryGame() {
            clearInterval(memTimerInterval);
            memFlipped = []; memMatched = 0; memMoves = 0; memTime = 0; memStarted = false; memLock = false;
            document.getElementById('mem-timer').innerText = '00:00';
            document.getElementById('mem-moves').innerText = '0';
            document.getElementById('memWinBox').style.display = 'none';
            const arena = document.getElementById('memGridArena');
            arena.style.display = 'grid'; arena.innerHTML = '';
            
            let shuffled = [...memData].sort(() => Math.random() - 0.5);
            shuffled.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('mem-card'); card.dataset.id = item.id;
                card.innerHTML = `
                    <div class="mem-face mem-front">C</div>
                    <div class="mem-face mem-back">
                        ${item.type === 'pic' ? `<span>${item.content}</span>` : `<div class="mem-text-node">${item.content}</div>`}
                    </div>`;
                card.addEventListener('click', flipMemCard);
                arena.appendChild(card);
            });
        }

        function flipMemCard() {
            if (memLock || this === memFlipped[0] || this.classList.contains('matched')) return;
            if (!memStarted) {
                memStarted = true;
                memTimerInterval = setInterval(() => {
                    memTime++;
                    document.getElementById('mem-timer').innerText = String(Math.floor(memTime/60)).padStart(2,'0') + ":" + String(memTime%60).padStart(2,'0');
                }, 1000);
            }

            playSound(400, 'sine', 0.08);
            this.classList.add('flipped'); memFlipped.push(this);

            if (memFlipped.length === 2) {
                memMoves++; document.getElementById('mem-moves').innerText = memMoves;
                memLock = true;
                if (memFlipped[0].dataset.id === memFlipped[1].dataset.id) {
                    setTimeout(() => {
                        playSound(650, 'triangle', 0.15);
                        memFlipped[0].classList.add('matched'); memFlipped[1].classList.add('matched');
                        memMatched++; memFlipped = []; memLock = false;
                        if (memMatched === memData.length / 2) {
                            clearInterval(memTimerInterval);
                            document.getElementById('memGridArena').style.display = 'none';
                            document.getElementById('memWinBox').style.display = 'block';
                            document.getElementById('memWinResult').innerText = `ගතවූ කාලය: ${document.getElementById('mem-timer').innerText} | උත්සාහයන්: ${memMoves}`;
                        }
                    }, 400);
                } else {
                    setTimeout(() => {
                        playSound(200, 'sawtooth', 0.1);
                        memFlipped[0].classList.remove('flipped'); memFlipped[1].classList.remove('flipped');
                        memFlipped = []; memLock = false;
                    }, 800);
                }
            }
        }
        window.onload = resetMemoryGame;
    </script>
</body>
</html>
