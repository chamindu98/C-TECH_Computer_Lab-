<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Schedule & Database</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .admin-panel { background: #eef2f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #2980b9; }
        .btn-logout { background-color: #c0392b; display: none; }
        .btn-delete { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #34495e; color: white; }
        .conflict-row { background-color: #ffcccc !important; }
        .badge { padding: 4px 8px; border-radius: 10px; font-size: 11px; color: white; font-weight: bold; }
        .badge-ok { background-color: #27ae60; }
        .badge-conflict { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏫 Live Class Schedule</h2>
        <div>
            <button id="loginBtn" class="btn-login" onclick="loginTeacher()">Teacher Login (ගුරුවරුන්ට)</button>
            <button id="logoutBtn" class="btn-logout" onclick="logoutTeacher()">Logout</button>
        </div>
    </div>

    <!-- Teacher Edit Panel -->
    <div id="adminPanel" class="admin-panel">
        <h3>➕ Add New Class (ගුරුභවතුන්ට පමණයි)</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Class Name:</label>
                <input type="text" id="className" placeholder="Science">
            </div>
            <div class="form-group">
                <label>Teacher Name:</label>
                <input type="text" id="teacherName" placeholder="Mr. Perera">
            </div>
            <div class="form-group">
                <label>Grade:</label>
                <select id="grade">
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                </select>
            </div>
            <div class="form-group">
                <label>Day:</label>
                <select id="day">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div class="form-group">
                <label>Start Time:</label>
                <input type="time" id="startTime">
            </div>
            <div class="form-group">
                <label>End Time:</label>
                <input type="time" id="endTime">
            </div>
            <div class="form-group">
                <label>Hall:</label>
                <select id="hall">
                    <option value="Hall 1">Hall 1</option>
                    <option value="Hall 2">Hall 2</option>
                </select>
            </div>
            <div class="form-group" style="justify-content: flex-end;">
                <button onclick="addClassToDatabase()">Save Class</button>
            </div>
        </div>
    </div>

    <!-- Student Schedule View -->
    <h3>📋 Current Time Table (ලයිව් කාලසටහන)</h3>
    <table>
        <thead>
            <tr>
                <th>Class</th>
                <th>Teacher</th>
                <th>Grade</th>
                <th>Day</th>
                <th>Time</th>
                <th>Hall</th>
                <th>Status</th>
                <th class="action-col" style="display: none;">Action</th>
            </tr>
        </thead>
        <tbody id="scheduleTable">
            <!-- Live Data Loaded From Database -->
        </tbody>
    </table>
</div>

<script>
    // 1. YOUR FIREBASE CONFIGURATION (Replace with your actual keys)
    const firebaseConfig = {
      apiKey: "AIzaSyAtfTwhOmDOLAxxTdXQKwaMNthLMpRgBjQ",
      authDomain: "ctech-counter.firebaseapp.com",
      databaseURL: "https://ctech-counter-default-rtdb.firebaseio.com",
      projectId: "ctech-counter",
      storageBucket: "ctech-counter.firebasestorage.app",
      messagingSenderId: "892307263196",
      appId: "1:892307263196:web:bf443261191503be652e19"
};
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isTeacher = false;
    const TEACHER_PASSWORD = "1234"; // ගුරුවරුන් සඳහා මුරපදය

    function loginTeacher() {
        const password = prompt("ගුරුභවතුන් සඳහා වන මුරපදය (Password) ඇතුළත් කරන්න:");
        if (password === TEACHER_PASSWORD) {
            isTeacher = true;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            toggleActionColumn(true);
            alert("ගුරු ගිණුමට සාර්ථකව පිවිසුණි!");
        } else {
            alert("වැරදි මුරපදයකි!");
        }
    }

    function logoutTeacher() {
        isTeacher = false;
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
        toggleActionColumn(false);
    }

    function toggleActionColumn(show) {
        const cols = document.querySelectorAll('.action-col');
        cols.forEach(col => col.style.display = show ? 'table-cell' : 'none');
        renderSchedule();
    }

    // Load Live Data from Firestore
    let liveSchedule = [];
    db.collection("schedule").onSnapshot((snapshot) => {
        liveSchedule = [];
        snapshot.forEach((doc) => {
            liveSchedule.push({ id: doc.id, ...doc.data() });
        });
        renderSchedule();
    });

    function addClassToDatabase() {
        const className = document.getElementById('className').value;
        const teacherName = document.getElementById('teacherName').value;
        const grade = document.getElementById('grade').value;
        const day = document.getElementById('day').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const hall = document.getElementById('hall').value;

        if (!className || !teacherName || !startTime || !endTime) {
            alert("සියලු විස්තර ඇතුළත් කරන්න!");
            return;
        }

        db.collection("schedule").add({
            className, teacherName, grade, day, startTime, endTime, hall
        }).then(() => {
            alert("පන්තිය සාර්ථකව එකතු විය!");
            clearForm();
        });
    }

    function deleteClass(docId) {
        if (confirm("මෙම පන්තිය ඉවත් කිරීමට තහවුරු කරන්න?")) {
            db.collection("schedule").doc(docId).delete();
        }
    }

    function renderSchedule() {
        const tbody = document.getElementById('scheduleTable');
        tbody.innerHTML = '';

        liveSchedule.forEach((item, index) => {
            const conflicts = checkConflicts(item, index);
            const isConflict = conflicts.length > 0;

            const tr = document.createElement('tr');
            if (isConflict) tr.classList.add('conflict-row');

            tr.innerHTML = `
                <td><strong>${item.className}</strong></td>
                <td>${item.teacherName}</td>
                <td>${item.grade}</td>
                <td>${item.day}</td>
                <td>${item.startTime} - ${item.endTime}</td>
                <td>${item.hall}</td>
                <td>${isConflict ? `<span class="badge badge-conflict">⚠️ ${conflicts.join(', ')}</span>` : `<span class="badge badge-ok">✅ OK</span>`}</td>
                ${isTeacher ? `<td><button class="btn-delete" onclick="deleteClass('${item.id}')">Delete</button></td>` : ''}
            `;
            tbody.appendChild(tr);
        });
    }

    function checkConflicts(target, targetIndex) {
        let conflicts = [];
        liveSchedule.forEach((item, index) => {
            if (targetIndex === index) return;
            if (target.day === item.day) {
                const isTimeOverlap = (target.startTime < item.endTime) && (target.endTime > item.startTime);
                if (isTimeOverlap) {
                    if (target.hall === item.hall) conflicts.push('Hall Overlap');
                    if (target.teacherName.toLowerCase() === item.teacherName.toLowerCase()) conflicts.push('Teacher Overlap');
                    if (target.grade === item.grade) conflicts.push('Grade Overlap');
                }
            }
        });
        return [...new Set(conflicts)];
    }

    function clearForm() {
        document.getElementById('className').value = '';
        document.getElementById('teacherName').value = '';
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
    }
</script>

</body>
</html>
