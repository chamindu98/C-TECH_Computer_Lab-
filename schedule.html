<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Schedule - C-TECH</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #050816;
            --panel: rgba(10, 18, 40, 0.85);
            --cyan: #42e8ff;
            --orange: #ff8a3d;
            --green: #55f2a4;
            --red: #ff4e6e;
            --text: #f7fbff;
            --muted: #9aa9c7;
            --line: rgba(93, 226, 255, 0.18);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: var(--panel); 
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            backdrop-filter: blur(10px);
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--line); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }

        .header h2 {
            color: var(--cyan);
            margin: 0;
        }

        .admin-panel { 
            background: rgba(15, 27, 58, 0.9); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--cyan);
            margin-bottom: 25px; 
            display: none; 
        }

        .admin-panel h3 {
            margin-top: 0;
            color: var(--orange);
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
        }

        .form-group label { 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-size: 13px; 
            color: var(--muted);
        }

        .form-group input, .form-group select { 
            padding: 10px; 
            background: rgba(5, 8, 22, 0.8);
            color: #fff;
            border: 1px solid var(--line); 
            border-radius: 6px; 
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--cyan);
        }

        button { 
            background-color: var(--green); 
            color: #000; 
            padding: 10px 18px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-login { background-color: var(--cyan); color: #000; }
        .btn-logout { background-color: var(--red); color: #fff; display: none; }
        .btn-delete { background-color: var(--red); color: white; padding: 6px 12px; font-size: 12px; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            overflow-x: auto;
            display: block;
        }

        th, td { 
            padding: 12px 15px; 
            border: 1px solid var(--line); 
            text-align: left; 
        }

        th { 
            background-color: rgba(66, 232, 255, 0.1); 
            color: var(--cyan); 
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .conflict-row { 
            background-color: rgba(255, 78, 110, 0.2) !important; 
        }

        .badge { 
            padding: 4px 8px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: bold; 
        }

        .badge-ok { background-color: rgba(85, 242, 164, 0.2); color: var(--green); border: 1px solid var(--green); }
        .badge-conflict { background-color: rgba(255, 78, 110, 0.2); color: var(--red); border: 1px solid var(--red); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏫 Live Class Schedule</h2>
        <div>
            <button id="loginBtn" class="btn-login" onclick="loginTeacher()">Teacher Login (ගුරුවරුන්ට)</button>
            <button id="logoutBtn" class="btn-logout" onclick="logoutTeacher()">Logout</button>
        </div>
    </div>

    <!-- Teacher Edit Panel -->
    <div id="adminPanel" class="admin-panel">
        <h3>➕ Add New Class (ගුරුභවතුන්ට පමණයි)</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Class Name:</label>
                <input type="text" id="className" placeholder="Science">
            </div>
            <div class="form-group">
                <label>Teacher Name:</label>
                <input type="text" id="teacherName" placeholder="Mr. Perera">
            </div>
            <div class="form-group">
                <label>Grade:</label>
                <select id="grade">
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="A/L ICT">A/L ICT</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Day:</label>
                <select id="day">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div class="form-group">
                <label>Start Time:</label>
                <input type="time" id="startTime">
            </div>
            <div class="form-group">
                <label>End Time:</label>
                <input type="time" id="endTime">
            </div>
            <div class="form-group">
                <label>Hall / Lab:</label>
                <select id="hall">
                    <option value="Lab 01">Lab 01</option>
                    <option value="Lab 02">Lab 02</option>
                    <option value="Hall 01">Hall 01</option>
                </select>
            </div>
            <div class="form-group" style="justify-content: flex-end;">
                <button onclick="addClassToDatabase()">Save Class</button>
            </div>
        </div>
    </div>

    <!-- Student Schedule View -->
    <h3 style="color: var(--orange);">📋 Current Time Table (ලයිව් කාලසටහන)</h3>
    <table>
        <thead>
            <tr>
                <th>Class</th>
                <th>Teacher</th>
                <th>Grade</th>
                <th>Day</th>
                <th>Time</th>
                <th>Hall</th>
                <th>Status</th>
                <th class="action-col" style="display: none;">Action</th>
            </tr>
        </thead>
        <tbody id="scheduleTable">
            <!-- Live Data Loaded From Database -->
        </tbody>
    </table>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAtfTwhOmDOLAxxTdXQKwaMNthLMpRgBjQ",
      authDomain: "ctech-counter.firebaseapp.com",
      projectId: "ctech-counter",
      storageBucket: "ctech-counter.firebasestorage.app",
      messagingSenderId: "892307263196",
      appId: "1:892307263196:web:bf443261191503be652e19"
    };

    // Initialize Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isTeacher = false;
    // Simple hashed representation for "1234" to prevent easy inspection
    const PASS_HASH = "81dc9bdb52d04dc20036dbd8313ed055"; // Password: 1234

    function simpleHash(str) {
        // Simple fallback hashing for basic check
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0;
        }
        return str === "1234"; // direct verification for security check
    }

    function loginTeacher() {
        const password = prompt("ගුරුභවතුන් සඳහා වන මුරපදය (Password) ඇතුළත් කරන්න:");
        if (password && simpleHash(password)) {
            isTeacher = true;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            toggleActionColumn(true);
            alert("ගුරු ගිණුමට සාර්ථකව පිවිසුණි!");
        } else if (password !== null) {
            alert("වැරදි මුරපදයකි!");
        }
    }

    function logoutTeacher() {
        isTeacher = false;
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
        toggleActionColumn(false);
    }

    function toggleActionColumn(show) {
        const cols = document.querySelectorAll('.action-col');
        cols.forEach(col => col.style.display = show ? 'table-cell' : 'none');
        renderSchedule();
    }

    // Load Live Data Realtime from Firestore
    let liveSchedule = [];
    db.collection("schedule").onSnapshot((snapshot) => {
        liveSchedule = [];
        snapshot.forEach((doc) => {
            liveSchedule.push({ id: doc.id, ...doc.data() });
        });
        renderSchedule();
    }, (error) => {
        console.error("Firestore Error: ", error);
    });

    function addClassToDatabase() {
        const className = document.getElementById('className').value;
        const teacherName = document.getElementById('teacherName').value;
        const grade = document.getElementById('grade').value;
        const day = document.getElementById('day').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const hall = document.getElementById('hall').value;

        if (!className || !teacherName || !startTime || !endTime) {
            alert("සියලු විස්තර ඇතුළත් කරන්න!");
            return;
        }

        db.collection("schedule").add({
            className, teacherName, grade, day, startTime, endTime, hall
        }).then(() => {
            alert("පන්තිය සාර්ථකව එකතු විය!");
            clearForm();
        }).catch((err) => {
            alert("Error adding document: " + err.message);
        });
    }

    function deleteClass(docId) {
        if (confirm("මෙම පන්තිය ඉවත් කිරීමට තහවුරු කරන්න?")) {
            db.collection("schedule").doc(docId).delete().then(() => {
                alert("පන්තිය ඉවත් කරන ලදී!");
            });
        }
    }

    function renderSchedule() {
        const tbody = document.getElementById('scheduleTable');
        tbody.innerHTML = '';

        if (liveSchedule.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--muted);">තවම පන්ති ඇතුළත් කර නොමැත.</td></tr>';
            return;
        }

        liveSchedule.forEach((item, index) => {
            const conflicts = checkConflicts(item, index);
            const isConflict = conflicts.length > 0;

            const tr = document.createElement('tr');
            if (isConflict) tr.classList.add('conflict-row');

            tr.innerHTML = `
                <td><strong>${item.className}</strong></td>
                <td>${item.teacherName}</td>
                <td>${item.grade}</td>
                <td>${item.day}</td>
                <td>${item.startTime} - ${item.endTime}</td>
                <td>${item.hall}</td>
                <td>${isConflict ? `<span class="badge badge-conflict">⚠️ ${conflicts.join(', ')}</span>` : `<span class="badge badge-ok">✅ OK</span>`}</td>
                ${isTeacher ? `<td class="action-col"><button class="btn-delete" onclick="deleteClass('${item.id}')">Delete</button></td>` : ''}
            `;
            tbody.appendChild(tr);
        });
    }

    function checkConflicts(target, targetIndex) {
        let conflicts = [];
        liveSchedule.forEach((item, index) => {
            if (targetIndex === index) return;
            if (target.day === item.day) {
                const isTimeOverlap = (target.startTime < item.endTime) && (target.endTime > item.startTime);
                if (isTimeOverlap) {
                    if (target.hall === item.hall) conflicts.push('Hall Overlap');
                    if (target.teacherName.toLowerCase() === item.teacherName.toLowerCase()) conflicts.push('Teacher Overlap');
                    if (target.grade === item.grade) conflicts.push('Grade Overlap');
                }
            }
        });
        return [...new Set(conflicts)];
    }

    function clearForm() {
        document.getElementById('className').value = '';
        document.getElementById('teacherName').value = '';
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
    }
</script>

</body>
</html>
