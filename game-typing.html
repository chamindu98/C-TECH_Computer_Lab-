<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-TECH - ICT Speed Typer</title>
    <style>
        :root {
            --primary-blue: #004d80;
            --light-blue: #00a4e4;
            --orange: #ff7300;
            --dark-bg: #0b132b;
            --card-bg: #1c2541;
            --text-light: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--dark-bg); color: var(--text-light);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
            background-image: radial-gradient(at 100% 100%, rgba(255, 115, 0, 0.1) 0px, transparent 50%);
        }

        .web-container {
            width: 100%; max-width: 650px; background-color: rgba(28, 37, 65, 0.85);
            backdrop-filter: blur(10px); border: 2px solid var(--light-blue);
            border-radius: 16px; padding: 25px; box-shadow: 0 0 30px rgba(0, 164, 228, 0.3); text-align: center;
        }

        .game-title { font-size: 1.8rem; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px var(--light-blue); }
        .game-desc { color: #a0aec0; margin-bottom: 20px; font-size: 0.95rem; }

        .game-area {
            background-color: rgba(11, 19, 43, 0.6); border-radius: 12px; padding: 30px;
            border: 1px dashed rgba(0, 164, 228, 0.4); margin-bottom: 20px;
        }

        .game-stats {
            display: flex; justify-content: space-between; background: rgba(255,255,255,0.03);
            padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold;
        }
        .stat-highlight { color: var(--orange); }

        .word-box-display { font-size: 2.5rem; font-weight: bold; color: #fff; margin: 20px 0; letter-spacing: 1px; text-shadow: 0 0 15px var(--light-blue); }

        input[type="text"] {
            width: 100%; padding: 12px; background-color: var(--dark-bg); border: 2px solid rgba(0, 164, 228, 0.5);
            border-radius: 6px; color: #fff; font-size: 1.2rem; text-align: center; margin-bottom: 20px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--light-blue); box-shadow: 0 0 10px rgba(0, 164, 228, 0.4); }

        .game-overlay-message { display: none; background: var(--card-bg); border: 2px solid var(--orange); border-radius: 8px; padding: 15px; margin-bottom: 20px; }

        button {
            width: 100%; padding: 12px; background: linear-gradient(90deg, #008cd1, var(--light-blue));
            border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: linear-gradient(90deg, var(--light-blue), #00b4ff); box-shadow: 0 0 15px rgba(0, 164, 228, 0.4); }
        
        .back-link { display: inline-block; margin-top: 20px; color: var(--light-blue); text-decoration: none; font-weight: 600; }
        .back-link:hover { color: var(--orange); }
    </style>
</head>
<body>
    <div class="web-container">
        <h2 class="game-title">⚡ ICT Speed Typer Challenge</h2>
        <p class="game-desc">තිරයේ දිස්වන තාක්ෂණික වචන වේගයෙන් සහ නිවැරදිව ටයිප් කරන්න.</p>
        
        <div class="game-area">
            <div class="game-stats">
                <div>Score: <span id="type-score" class="stat-highlight">0</span></div>
                <div>Time Left: <span id="type-timer" class="stat-highlight">15s</span></div>
            </div>

            <div class="game-overlay-message" id="typeGameOverBox">
                <p style="color: var(--orange); font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">⌛ කාලය අවසන් විය!</p>
                <p id="typeFinalScore"></p>
            </div>

            <div id="typingPlayZone">
                <div class="word-box-display" id="targetWord">C-TECH</div>
                <input type="text" id="typeInput" placeholder="මෙහි නිවැරදිව ටයිප් කරන්න..." autocomplete="off" disabled>
            </div>

            <button onclick="resetTypingGame()" id="typeBtn">Start Game</button>
        </div>

        <a href="games.html" class="back-link">← වෙනත් ගේම් එකක් තෝරන්න</a>
    </div>

    <script>
        function playSound(freq, type, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        const typingWords = ["Computer", "Keyboard", "Software", "Hardware", "Internet", "Database", "Network", "Processor", "Memory", "Binary", "Algorithm", "Router", "Monitor", "Mouse", "Firewall", "Server"];
        let targetWord = ""; let typeScore = 0; let typeTimeLeft = 15; let typeTimerInterval = null; let isTypePlaying = false;

        const typeInput = document.getElementById('typeInput');
        typeInput.addEventListener('input', () => {
            if (!isTypePlaying) return;
            if (typeInput.value.trim() === targetWord) {
                playSound(700, 'sine', 0.05); typeScore++;
                document.getElementById('type-score').innerText = typeScore;
                typeInput.value = ''; typeTimeLeft += 3;
                if (typeTimeLeft > 20) typeTimeLeft = 20;
                setNewWord();
            }
        });

        function resetTypingGame() {
            clearInterval(typeTimerInterval);
            typeScore = 0; typeTimeLeft = 15; isTypePlaying = true;
            document.getElementById('type-score').innerText = typeScore;
            document.getElementById('type-timer').innerText = typeTimeLeft + 's';
            document.getElementById('typeGameOverBox').style.display = 'none';
            document.getElementById('typeInput').disabled = false;
            typeInput.value = ''; typeInput.focus(); setNewWord();
            document.getElementById('typeBtn').innerText = "Restart Game";
            
            typeTimerInterval = setInterval(() => {
                typeTimeLeft--;
                document.getElementById('type-timer').innerText = typeTimeLeft + 's';
                if (typeTimeLeft <= 0) {
                    clearInterval(typeTimerInterval); isTypePlaying = false;
                    document.getElementById('typeInput').disabled = true;
                    document.getElementById('typeGameOverBox').style.display = 'block';
                    document.getElementById('typeFinalScore').innerText = `ඔබ ලබාගත් මුළු ලකුණු: ${typeScore}`;
                    document.getElementById('typeBtn').innerText = "Start Game";
                    playSound(180, 'sawtooth', 0.3);
                }
            }, 1000);
        }

        function setNewWord() {
            targetWord = typingWords[Math.floor(Math.random() * typingWords.length)];
            document.getElementById('targetWord').innerText = targetWord;
        }
    </script>
</body>
</html>
