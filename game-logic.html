<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-TECH - Logic Gate Builder Pro</title>
    <style>
        :root {
            --light-blue: #00a4e4; --orange: #ff7300; --dark-bg: #0b132b; --card-bg: #1c2541; --text-light: #f4f7f6;
            --on-color: #2ecc71; --off-color: #e74c3c; --wire-on: #2ecc71; --wire-off: #555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--dark-bg); color: var(--text-light);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 164, 228, 0.15) 0px, transparent 50%);
        }
        .web-container {
            width: 100%; max-width: 850px; background-color: rgba(28, 37, 65, 0.85);
            backdrop-filter: blur(10px); border: 2px solid var(--light-blue);
            border-radius: 16px; padding: 25px; box-shadow: 0 0 30px rgba(0, 164, 228, 0.3); text-align: center;
        }
        .game-title { font-size: 1.8rem; color: #fff; margin-bottom: 5px; text-shadow: 0 0 10px var(--light-blue); }
        .game-desc { color: #a0aec0; margin-bottom: 20px; font-size: 0.95rem; }
        
        .circuit-board {
            background: #0f172a; border-radius: 12px; border: 2px solid #1e293b;
            padding: 25px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        
        .gate-title-display { font-size: 1.6rem; font-weight: bold; color: var(--orange); letter-spacing: 1px; }

        .gate-simulator { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; margin: 15px 0; min-height: 160px;}
        
        .inputs-zone { display: flex; flex-direction: column; gap: 20px; }
        .switch-btn {
            width: 75px; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer;
            transition: 0.3s; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 1rem;
        }
        .switch-btn.off { background: var(--off-color); }
        .switch-btn.on { background: var(--on-color); box-shadow: 0 0 15px var(--on-color); }

        /* 🎛️ Circuit Graphics Framework */
        .circuit-display-container { display: flex; align-items: center; gap: 15px; position: relative; justify-content: center; }

        .gate-graphic-box {
            padding: 15px 20px; background: var(--card-bg); border: 2px solid var(--light-blue);
            border-radius: 8px; font-size: 1.3rem; font-weight: bold; color: #fff; 
            box-shadow: inset 0 0 15px rgba(0, 164, 228, 0.2); position: relative; text-align: center;
        }
        
        /* Combined Layouts */
        .combined-layout { display: flex; align-items: center; gap: 20px; }
        .sub-gates-column { display: flex; flex-direction: column; gap: 30px; }
        .wire-line { height: 3px; background: var(--wire-off); width: 25px; transition: 0.3s; }
        .wire-line.active { background: var(--wire-on); box-shadow: 0 0 8px var(--wire-on); }

        .inter-node { font-size: 0.8rem; color: #ffeb3b; background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 4px; position: absolute; white-space: nowrap; }

        .output-zone { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 90px; }
        .bulb { font-size: 3.5rem; filter: drop-shadow(0 0 0px transparent); transition: 0.3s; user-select: none;}
        .bulb.glow { filter: drop-shadow(0 0 25px #ffeb3b); animation: pulse 1.5s infinite alternate; }

        .target-mission { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; font-weight: 500; border: 1px solid rgba(255,255,255,0.05); width: 100%; }
        .status-msg { font-size: 1.2rem; font-weight: bold; margin-top: 5px; height: 30px; }

        /* 📊 TRUTH TABLE STYLES */
        .truth-table-container {
            width: 100%; background: rgba(28, 37, 65, 0.6); border-radius: 8px; padding: 15px;
            border: 1px solid rgba(0, 164, 228, 0.2); margin-top: 10px;
        }
        .truth-table-container h4 { font-size: 1rem; color: var(--light-blue); margin-bottom: 10px; text-align: left; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        th { background-color: rgba(11, 19, 43, 0.8); color: #fff; }
        tr.highlighted-row { background-color: rgba(255, 115, 0, 0.3) !important; color: #fff; font-weight: bold; border: 2px solid var(--orange); }
        tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }

        button.main-action {
            width: 100%; max-width: 255px; padding: 14px; background: linear-gradient(90deg, #008cd1, var(--light-blue));
            border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.main-action:hover { box-shadow: 0 0 15px var(--light-blue); }
        .back-link { display: inline-block; margin-top: 15px; color: var(--light-blue); text-decoration: none; font-weight: 600; }
        
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    </style>
</head>
<body>
    <div class="web-container">
        <h2 class="game-title">⚡ Logic Gate Builder Pro</h2>
        <p class="game-desc">සරල ගේට්ටුවල සිට සංකීර්ණ ඒකාබද්ධ පරිපථ දක්වා පියවරෙන් පියවර තාක්ෂණික ඥානය වර්ධනය කරගන්න.</p>

        <div class="circuit-board">
            <div class="gate-title-display" id="gateName">LEVEL 1: NOT GATE</div>
            <div class="target-mission" id="missionText">අරමුණ: බල්බය දැල්වීම (Output = 1) සිදුකරන්න.</div>

            <div class="gate-simulator">
                <div class="inputs-zone">
                    <button class="switch-btn off" id="inputA" onclick="toggleInput('A')">A: 0</button>
                    <button class="switch-btn off" id="inputB" onclick="toggleInput('B')">B: 0</button>
                </div>

                <div class="wire-line" id="mainWireIn"></div>

                <div class="circuit-display-container" id="circuitDisplay"></div>

                <div class="wire-line" id="mainWireOut"></div>

                <div class="output-zone">
                    <div class="bulb" id="bulbIcon">💡</div>
                    <span style="font-weight: bold;">Output (X): <span id="outValue" style="color:var(--orange)">0</span></span>
                </div>
            </div>

            <div class="truth-table-container">
                <h4>Interactive Truth Table (සත්‍යතා වගුව)</h4>
                <table id="truthTable"></table>
            </div>

            <div class="status-msg" id="statusMsg"></div>
            <button class="main-action" onclick="nextLevel()">ඊළඟ මට්ටම (Next Level) →</button>
        </div>

        <a href="games.html" class="back-link">← වෙනත් ගේම් එකක් තෝරන්න</a>
    </div>

    <script>
        const levels = [
            { id: 1, gate: 'NOT', target: 1, type: 'single', desc: 'Level 1: NOT ද්වාරය (Inverter) මඟින් ආදානය (Input) ප්‍රතිලෝම කරයි. බල්බය දල්වන්න.' },
            { id: 2, gate: 'AND', target: 1, type: 'basic', desc: 'Level 2: AND ද්වාරය. ප්‍රතිදානය 1 වීමට නම් ආදාන සියල්ලම 1 විය යුතුය. බල්බය දල්වන්න.' },
            { id: 3, gate: 'OR', target: 1, type: 'basic', desc: 'Level 3: OR ද්වාරය. ආදානවලින් ඕනෑම එකක් 1 වුවහොත් ප්‍රතිදානය 1 වේ. බල්බය දල්වන්න.' },
            { id: 4, gate: 'NAND', target: 0, type: 'basic', desc: 'Level 4: NAND ද්වාරය (NOT + AND). මෙහිදී බල්බය නිවා දැමීමට (Output = 0) උත්සාහ කරන්න.' },
            { id: 5, gate: 'NOR', target: 1, type: 'basic', desc: 'Level 5: NOR ද්වාරය (NOT + OR). ද්වාරයේ ක්‍රියාවලිය වටහාගෙන බල්බය දල්වන්න.' },
            { id: 6, gate: 'XOR', target: 1, type: 'basic', desc: 'Level 6: Exclusive OR (XOR) ද්වාරය. ආදාන දෙක එකිනෙකට වෙනස් වූ විට ප්‍රතිදානය 1 වේ.' },
            { id: 7, gate: 'COMBINED_1', target: 1, type: 'complex', desc: 'Level 7 (පරිපථ): X = (A AND B) OR (NOT A) පරිපථය ක්‍රියා කරවා බල්බය දල්වන්න.' },
            { id: 8, gate: 'COMBINED_2', target: 1, type: 'complex', desc: 'Level 8 (සංකීර්ණ පරිපථ): X = (A NAND B) XOR (A OR B) අවසාන මහා අභියෝගය ජයගන්න!' }
        ];
        
        let currentLevel = 0; let valA = 0; let valB = 0;

        function toggleInput(type) {
            if (type === 'A') {
                valA = valA === 0 ? 1 : 0;
                updateSwitchDisplay('inputA', valA);
            } else {
                valB = valB === 0 ? 1 : 0;
                updateSwitchDisplay('inputB', valB);
            }
            calculateOutput();
        }

        function updateSwitchDisplay(id, val) {
            const btn = document.getElementById(id);
            btn.innerText = id === 'inputA' ? `A: ${val}` : `B: ${val}`;
            btn.className = val === 1 ? "switch-btn on" : "switch-btn off";
        }

        function calculateOutput() {
            let out = 0;
            let gate = levels[currentLevel].gate;
            
            // Wire logic visual feedback variables
            let mid1 = 0, mid2 = 0;

            if (gate === 'AND') { out = valA && valB; }
            else if (gate === 'OR') { out = valA || valB; }
            else if (gate === 'NOT') { out = valA === 0 ? 1 : 0; }
            else if (gate === 'NAND') { out = !(valA && valB) ? 1 : 0; }
            else if (gate === 'NOR') { out = !(valA || valB) ? 1 : 0; }
            else if (gate === 'XOR') { out = valA !== valB ? 1 : 0; }
            else if (gate === 'COMBINED_1') { 
                mid1 = valA && valB;
                mid2 = valA === 0 ? 1 : 0;
                out = mid1 || mid2 ? 1 : 0;
            }
            else if (gate === 'COMBINED_2') {
                mid1 = !(valA && valB) ? 1 : 0;
                mid2 = valA || valB ? 1 : 0;
                out = mid1 !== mid2 ? 1 : 0;
            }

            document.getElementById('outValue').innerText = out;
            const bulb = document.getElementById('bulbIcon');
            if (out === 1) bulb.classList.add('glow'); else bulb.classList.remove('glow');

            // Set wire colors live
            document.getElementById('mainWireIn').className = (valA || valB) ? "wire-line active" : "wire-line";
            document.getElementById('mainWireOut').className = out === 1 ? "wire-line active" : "wire-line";

            // Update intermediate text values if combined level
            if (levels[currentLevel].type === 'complex') {
                const node1 = document.getElementById('nodeMid1');
                const node2 = document.getElementById('nodeMid2');
                if(node1) node1.innerText = `Node: ${mid1}`;
                if(node2) node2.innerText = `Node: ${mid2}`;
            }

            highlightTruthTableRow();

            // Success trigger check
            const status = document.getElementById('statusMsg');
            if (out === levels[currentLevel].target) {
                status.innerText = currentLevel === levels.length - 1 ? "🏆 නියමයි! ඔබ සියලුම තාර්කික පරිපථ මට්ටම් ජයගත්තා!" : "🎯 නිවැරදියි! මීළඟ මට්ටම අගුළු හැරුණා.";
                status.style.color = "#2ecc71";
            } else {
                status.innerText = "";
            }
        }

        function renderCircuitGraphic() {
            const container = document.getElementById('circuitDisplay');
            container.innerHTML = "";
            let lvl = levels[currentLevel];

            if (lvl.gate === 'COMBINED_1') {
                container.innerHTML = `
                    <div class="combined-layout">
                        <div class="sub-gates-column">
                            <div class="gate-graphic-box" style="font-size:1rem; padding:8px 12px;">AND <span class="inter-node" id="nodeMid1" style="top:-18px; right:0;"></span></div>
                            <div class="gate-graphic-box" style="font-size:1rem; padding:8px 12px;">NOT <span class="inter-node" id="nodeMid2" style="bottom:-18px; right:0;"></span></div>
                        </div>
                        <div class="wire-line active"></div>
                        <div class="gate-graphic-box">OR</div>
                    </div>`;
            } else if (lvl.gate === 'COMBINED_2') {
                container.innerHTML = `
                    <div class="combined-layout">
                        <div class="sub-gates-column">
                            <div class="gate-graphic-box" style="font-size:1rem; padding:8px 12px;">NAND <span class="inter-node" id="nodeMid1" style="top:-18px; right:0;"></span></div>
                            <div class="gate-graphic-box" style="font-size:1rem; padding:8px 12px;">OR <span class="inter-node" id="nodeMid2" style="bottom:-18px; right:0;"></span></div>
                        </div>
                        <div class="wire-line active"></div>
                        <div class="gate-graphic-box">XOR</div>
                    </div>`;
            } else {
                container.innerHTML = `<div class="gate-graphic-box">${lvl.gate}</div>`;
            }
        }

        function buildTruthTable() {
            const table = document.getElementById('truthTable');
            table.innerHTML = "";
            let gate = levels[currentLevel].gate;

            if (gate === 'NOT') {
                table.innerHTML = `<tr><th>A</th><th>Output (X)</th></tr>
                                   <tr id="row-0-0"><td>0</td><td>1</td></tr>
                                   <tr id="row-1-0"><td>1</td><td>0</td></tr>`;
            } else if (gate === 'COMBINED_1') {
                table.innerHTML = `<tr><th>A</th><th>B</th><th>A AND B</th><th>NOT A</th><th>Output (X)</th></tr>
                                   <tr id="row-0-0"><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
                                   <tr id="row-0-1"><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>
                                   <tr id="row-1-0"><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
                                   <tr id="row-1-1"><td>1</td><td>1</td><td>1</td><td>0</td><td>1</td></tr>`;
            } else if (gate === 'COMBINED_2') {
                table.innerHTML = `<tr><th>A</th><th>B</th><th>A NAND B</th><th>A OR B</th><th>Output (X)</th></tr>
                                   <tr id="row-0-0"><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td></tr>
                                   <tr id="row-0-1"><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
                                   <tr id="row-1-0"><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td></tr>
                                   <tr id="row-1-1"><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>`;
            } else {
                table.innerHTML = `<tr><th>A</th><th>B</th><th>Output (X)</th></tr>
                                   <tr id="row-0-0"><td>0</td><td>0</td><td>${evaluateGeneric(gate,0,0)}</td></tr>
                                   <tr id="row-0-1"><td>0</td><td>1</td><td>${evaluateGeneric(gate,0,1)}</td></tr>
                                   <tr id="row-1-0"><td>1</td><td>0</td><td>${evaluateGeneric(gate,1,0)}</td></tr>
                                   <tr id="row-1-1"><td>1</td><td>1</td><td>${evaluateGeneric(gate,1,1)}</td></tr>`;
            }
        }

        function evaluateGeneric(gate, a, b) {
            if (gate === 'AND') return a && b;
            if (gate === 'OR') return a || b;
            if (gate === 'NAND') return !(a && b) ? 1 : 0;
            if (gate === 'NOR') return !(a || b) ? 1 : 0;
            if (gate === 'XOR') return a !== b ? 1 : 0;
            return 0;
        }

        function highlightTruthTableRow() {
            document.querySelectorAll('#truthTable tr').forEach(r => r.classList.remove('highlighted-row'));
            let rowId = `row-${valA}-${valB}`;
            const activeRow = document.getElementById(rowId);
            if (activeRow) activeRow.classList.add('highlighted-row');
        }

        function nextLevel() {
            currentLevel = (currentLevel + 1) % levels.length;
            valA = 0; valB = 0;
            updateSwitchDisplay('inputA', 0);
            updateSwitchDisplay('inputB', 0);
            
            const lvl = levels[currentLevel];
            document.getElementById('gateName').innerText = `LEVEL ${lvl.id}: ${lvl.gate.replace('_',' ')} ENGINE`;
            document.getElementById('missionText').innerText = lvl.desc;
            
            document.getElementById('inputB').style.display = lvl.type === 'single' ? 'none' : 'block';

            renderCircuitGraphic();
            buildTruthTable();
            calculateOutput();
        }
        
        window.onload = () => {
            renderCircuitGraphic();
            buildTruthTable();
            calculateOutput();
        };
    </script>
</body>
</html>
