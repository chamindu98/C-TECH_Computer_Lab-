<!DOCTYPE html>
<html lang="si">
<head>

    <style>

        }

<body>

<div id="game-container">

        { title: "43/50 - Inverter Gate", question: "ලැබෙන ආදානය සම්පූර්ණයෙන්ම කණපිට හරවන (0 -> 1, 1 -> 0) ද්වාරය කුමක්ද?", answers: [{ text: "A. NOT Gate", isCorrect: true, x: 500, y: 90 }, { text: "B. AND Gate", isCorrect: false, x: 500, y: 240 }] },
        { title: "44/50 - Flowchart Start", question: "ප්‍රවාහ සටහනක (Flowchart) ආරම්භය සහ අවසානය දැක්වීමට ගන්නා රූපය?", answers: [{ text: "A. ඍජුකෝණාස්‍රය", isCorrect: false, x: 500, y: 90 }, { text: "B. ඕවලාකාරය (Oval)", isCorrect: true, x: 500, y: 240 }] },
        { title: "45/50 - Flowchart Input", question: "ප්‍රවාහ සටහනක දත්ත ඇතුළත් කිරීම (Input) නිරූපණය කරන ජ්‍යාමිතික රූපය?", answers: [{ text: "A. සමාන්තරාස්‍රය (Parallelogram)", isCorrect: true, x: 500, y: 90 }, { text: "B. රොම්බසය", isCorrect: false, x: 500, y: 240 }] },
        { title: "46/50 - Pseudo-Code", question: "පරිගණක භාෂාවකට සමානව මිනිස් බසින් ලියන පියවරෙන් පියවර විසඳුම් මාලාව?", answers: [{ text: "A. Flowchart", isCorrect: false, x: 500, y: 90 }, { text: "B. Pseudocode (ව්‍යාජ කේත)", isCorrect: true, x: 500, y: 240 }] },
        { title: "47/50 - Pascal Code", question: "Pascal ක්‍රමලේඛන භාෂාවේ විචල්‍යයන් (Variables) හඳුන්වා දීමට ගන්නා Keyword එක?", answers: [{ text: "A. VAR", isCorrect: true, x: 500, y: 90 }, { text: "B. BEGIN", isCorrect: false, x: 500, y: 240 }] },
        { title: "48/50 - Pascal Output", question: "Pascal වලදී තිරය මත යමක් මුද්‍රණය/ප්‍රදර්ශනය කිරීමට ගන්නා විධානය?", answers: [{ text: "A. Readln;", isCorrect: false, x: 500, y: 90 }, { text: "B. Writeln;", isCorrect: true, x: 500, y: 240 }] },
        { title: "49/50 - Cyber Security Threat", question: "අපගේ අනුමැතියකින් තොරව පරිගණකයට ඇතුල් වී දත්ත විනාශ කරන මෘදුකාංග?", answers: [{ text: "A. Computer Virus / Malware", isCorrect: true, x: 500, y: 90 }, { text: "B. Firmware", isCorrect: false, x: 500, y: 240 }] },
        { title: "50/50 - Strong Password", question: "සයිබර් හොරුන්ගෙන් ගිණුම් බේරා ගැනීමට තැබිය යුතු වඩාත්ම ආරක්ෂිත මුරපදය (Password)?", answers: [{ text: "A. 12345678", isCorrect: false, x: 500, y: 90 }, { text: "B. P@ss12#Wd (අකුරු, ඉලක්කම්, සංකේත සහිත)", isCorrect: true, x: 500, y: 240 }] }
    ];

    // Key Listeners
    window.addEventListener("keydown", e => {
        keys[e.code] = true;
    });
    window.addEventListener("keyup", e => {
        keys[e.code] = false;
    });

    function initLevel() {
        // බග් එක වැළැක්වීම සඳහා සියලුම pressed keys Clear කිරීම සිදු කෙරේ
        keys = {}; 

        if (currentLevel >= levelsData.length) {
            alert("🎉 උපරිමයි! ඔයා CyberQuest මට්ටම් 50ම ජයගෙන මහා සයිබර් අධිරාජ්‍යයා වුණා! 🏆");
            currentLevel = 0; 
            score = 0;
        }
        
        document.getElementById("level-title").innerText = levelsData[currentLevel].title;
        document.getElementById("question-text").innerText = levelsData[currentLevel].question;
        document.getElementById("score-display").innerText = score;
        
        player.x = 60;
        player.y = 200;
    }

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + 260 && 
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + 70 &&    
               rect1.y + rect1.height > rect2.y;
    }

    function update() {
        if ((keys["ArrowUp"] || keys["KeyW"]) && player.y > 10) player.y -= player.speed;
        if ((keys["ArrowDown"] || keys["KeyS"]) && player.y < canvas.height - player.height - 10) player.y += player.speed;
        if ((keys["ArrowLeft"] || keys["KeyA"]) && player.x > 10) player.x -= player.speed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && player.x < canvas.width - player.width - 10) player.x += player.speed;

        let lvl = levelsData[currentLevel];
        for (let ans of lvl.answers) {
            if (checkCollision(player, ans)) {
                // ගැටලුව මඟහැරවීමට collision එක හඳුනාගත් සැනින් keys object එක හිස් කරනු ලැබේ
                keys = {}; 
                
                if (ans.isCorrect) {
                    score += 10;
                    currentLevel++;
                    alert("🎖️ නිවැරදියි! ඊළඟ මට්ටමට පිවිසෙන්න.");
                    initLevel();
                } else {
                    score = Math.max(0, score - 5); 
                    alert("❌ පිළිතුර වැරදියි! නැවත උත්සාහ කරන්න.");
                    player.x = 60; 
                    player.y = 200;
                    document.getElementById("score-display").innerText = score;
                }
                break;
            }
        }
    }

    function draw() {
        ctx.fillStyle = "#090d13";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Cyber Grid Layout
        ctx.strokeStyle = "#161b22";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = 0; j < canvas.height; j += 40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        // Draw Player (Neon Cyan Cube)
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00fff5";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        
        // Robot Eyes Inside Player
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(player.x + 6, player.y + 8, 6, 6);
        ctx.fillRect(player.x + 20, player.y + 8, 6, 6);
        ctx.fillStyle = "#0d1117";
        ctx.fillRect(player.x + 6, player.y + 20, 20, 3);

        // Draw Choices Blocks
        let lvl = levelsData[currentLevel];
        lvl.answers.forEach(ans => {
            ctx.fillStyle = "#1f242c";
            ctx.strokeStyle = "#30363d";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            
            ctx.fillRect(ans.x, ans.y, 260, 70);
            ctx.strokeRect(ans.x, ans.y, 260, 70);

            // Colorful Indicator Bar
            if(ans.text.startsWith("A")) {
                ctx.fillStyle = "#ff5f56";
            } else {
                ctx.fillStyle = "#ffbd2e";
            }
            ctx.fillRect(ans.x, ans.y, 6, 70);

            // Display text beautifully
            ctx.fillStyle = "#e1e4e8";
            ctx.shadowBlur = 0; 
            ctx.font = "bold 13px 'Segoe UI', sans-serif";
            ctx.fillText(ans.text, ans.x + 18, ans.y + 40);
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    initLevel();
    gameLoop();
</script>
