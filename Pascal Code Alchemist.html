<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C-TECH - Pascal Code Alchemist</title>
    <style>
        :root {
            --light-blue: #00a4e4; 
            --orange: #ff7300; 
            --dark-bg: #0b132b; 
            --card-bg: #1c2541; 
            --text-light: #f4f7f6;
            --text-muted: #a0aec0;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg); 
            color: var(--text-light);
            line-height: 1.4;
            padding: 8px;
            min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 164, 228, 0.15) 0px, transparent 50%);
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            margin: 10px auto;
            background-color: rgba(28, 37, 65, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 164, 228, 0.3);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge-orange { background: var(--orange); color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }
        .badge-blue { background: var(--light-blue); color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }

        .game-title {
            font-size: 1.5rem;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 164, 228, 0.4);
        }

        .mission-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--gold);
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        /* 🎮 Workspace Layout for Mobile Grid */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .board {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 280px;
        }

        .board-title {
            color: var(--light-blue);
            font-size: 1rem;
            margin-bottom: 10px;
            border-bottom: 2px solid rgba(0, 164, 228, 0.2);
            padding-bottom: 5px;
            font-weight: 600;
        }

        .slot-container, .items-pool {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            padding: 5px 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* 🧩 Pascal Code Blocks Styles */
        .code-block {
            padding: 8px 12px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            width: 90%;
            text-align: left;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: all 0.15s ease;
            user-select: none;
        }

        .code-block:active {
            transform: scale(0.96);
        }

        .code-block.selected {
            border-color: var(--orange);
            background: rgba(255, 115, 0, 0.15);
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        @media (min-width: 600px) {
            .controls-row { display: flex; justify-content: center; }
        }

        .btn {
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover { background: #ff8826; }
        .btn-secondary { background: #475569; }
        .btn-success { background: var(--success); grid-column: span 2; }
        @media (min-width: 600px) { .btn-success { grid-column: auto; } }

        .feedback {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.05rem;
            min-height: 25px;
        }

        .footer-credits {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-ui">
            <span class="badge-orange" id="topic-badge">Pascal මූලික ව්‍යුහය</span>
            <span class="badge-blue" id="level-indicator">Level: 1 / 20</span>
        </div>

        <h1 class="game-title">✨ Pascal Code Alchemist ✨</h1>
        
        <div class="mission-box">
            <p><strong>📜 අද්‍යයන මෙහෙයුම:</strong> <span id="mission-text">ලෝඩ් වෙමින්...</span></p>
        </div>

        <div class="workspace">
            <div class="board">
                <div class="board-title">ඔබේ පරිගණක කේතය (Your Code Compiler)</div>
                <div id="slots" class="slot-container"></div>
            </div>

            <div class="board">
                <div class="board-title">කේත කැබලි (Code Magic Blocks)</div>
                <div id="pool" class="items-pool"></div>
            </div>
        </div>

        <div id="feedback-msg" class="feedback"></div>

        <div class="game-controls">
            <div class="controls-row">
                <button class="btn" onclick="compileCode()">කේතය ධාවනය (Run Code)</button>
                <button class="btn btn-secondary" onclick="resetLevel()">නැවත මුල සිට</button>
                <button class="btn btn-success" id="next-level-btn" onclick="goToNextLevel()" style="display:none;">ඊළඟ මට්ටමට ➔</button>
            </div>
        </div>

        <div class="footer-credits">
            <span>💻 C-TECH Gamified Learning</span>
            <span>Mobile Optimized © 2026</span>
        </div>
    </div>

    <script>
        // 🚀 Comprehensive 20 Levels Pascal Syllabus Dataset
        const pascalLevels = [
            {
                topic: "Pascal මූලික ව්‍යුහය",
                mission: "සරලම Pascal වැඩසටහනක් ආරම්භ කර අවසන් කරන නිවැරදි ව්‍යුහය පෙළගස්වන්න.",
                correct: ["program Simple;", "begin", "end."],
                pool: ["end.", "begin", "program Simple;", "readln;"]
            },
            {
                topic: "තිරය මත මුද්‍රණය",
                mission: "'Hello World' යන පාඨය තිරය මත දර්ශනය (Print) කරන නිවැරදි කේතය සකසන්න.",
                correct: ["program Hello;", "begin", "writeln('Hello World');", "end."],
                pool: ["writeln('Hello World');", "end.", "begin", "program Hello;"]
            },
            {
                topic: "විචල්‍ය ප්‍රකාශ කිරීම (Variables)",
                mission: "සංඛ්‍යාත්මක (Integer) අගයන් ගබඩා කිරීමට 'Age' නමින් විචල්‍යයක් ප්‍රකාශ කරන්න.",
                correct: ["program VarCheck;", "var Age: integer;", "begin", "end."],
                pool: ["var Age: integer;", "begin", "end.", "program VarCheck;", "Age = integer;"]
            },
            {
                topic: "අගයන් ආදේශ කිරීම (Assignment)",
                mission: "Num නමැති විචල්‍යයට 25 ක අගයක් ලබා දෙන (Assign කරන) නිවැරදි ප්‍රකාශනය සකසන්න.",
                correct: ["program Assign;", "var Num: integer;", "begin", "Num := 25;", "end."],
                pool: ["Num := 25;", "end.", "begin", "Num = 25;", "var Num: integer;", "program Assign;"]
            },
            {
                topic: "දත්ත පරිශීලකයාගෙන් ලබා ගැනීම",
                mission: "පරිශීලකයා ඇතුළත් කරන අගයක් 'X' විචල්‍යය තුළට කියවා ගන්න (Input).",
                correct: ["program InputTest;", "var X: integer;", "begin", "readln(X);", "end."],
                pool: ["readln(X);", "begin", "end.", "var X: integer;", "program InputTest;", "writeln(X);"]
            },
            {
                topic: "සරල ගණිතමය එකතුව",
                mission: "A හා B එකතු කර ලැබෙන අගය Sum වෙත ලබා දෙන සූත්‍රය පෙළගස්වන්න.",
                correct: ["program MathSum;", "begin", "Sum := A + B;", "writeln(Sum);", "end."],
                pool: ["Sum := A + B;", "writeln(Sum);", "end.", "begin", "Sum = A + B;", "program MathSum;"]
            },
            {
                topic: "දශම සංඛ්‍යා භාවිතය (Real)",
                mission: "සාමාන්‍ය අගයක් (Average) ගබඩා කිරීමට 'Avg' නමින් දශම සංඛ්‍යා විචල්‍යයක් (Real) ප්‍රකාශ කරන්න.",
                correct: ["program FloatTest;", "var Avg: real;", "begin", "end."],
                pool: ["var Avg: real;", "begin", "end.", "program FloatTest;", "var Avg: integer;"]
            },
            {
                topic: "අක්ෂර දත්ත භාවිතය (String)",
                mission: "නමක් ගබඩා කිරීම සඳහා 'Name' නමින් String විචල්‍යයක් ප්‍රකාශ කරන්න.",
                correct: ["program StrTest;", "var Name: string;", "begin", "end."],
                pool: ["var Name: string;", "begin", "end.", "program StrTest;", "var Name: char;"]
            },
            {
                topic: "තේරීම් ව්‍යුහය (IF-THEN)",
                mission: "ලකුණු (Marks) 50 ට වැඩි නම් 'Pass' ලෙස මුද්‍රණය කරන සරල කොන්දේසියක් සකසන්න.",
                correct: ["if (Marks > 50) then", "writeln('Pass');"],
                pool: ["if (Marks > 50) then", "writeln('Pass');", "if Marks > 50 do", "writeln(Pass);"]
            },
            {
                topic: "ද්විත්ව තේරීම (IF-THEN-ELSE)",
                mission: "වයස 18 ට අඩු නම් 'Child' ද, නැත්නම් 'Adult' ද මුද්‍රණය කරන කේතය සකසන්න (Else වලට පෙර සෙමිකෝලන නොයෙදෙන බව සලකන්න).",
                correct: ["if (Age < 18) then", "writeln('Child')", "else", "writeln('Adult');"],
                pool: ["if (Age < 18) then", "writeln('Child')", "else", "writeln('Adult');", "writeln('Child');", "else;"]
            },
            {
                topic: "FOR පුනර්කරණය (Loop)",
                mission: "1 සිට 5 දක්වා අගයන් නිතරම කැරකැවෙන සරල FOR ලූපයක් නිර්මාණය කරන්න.",
                correct: ["for i := 1 to 5 do", "begin", "writeln(i);", "end;"],
                pool: ["for i := 1 to 5 do", "begin", "writeln(i);", "end;", "for i = 1 to 5", "end."]
            },
            {
                topic: "WHILE පුනර්කරණය",
                mission: "X හි අගය 10 ට වඩා අඩු වන තෙක් ක්‍රියාත්මක වන WHILE ලූපයේ ව්‍යුහය පෙළගස්වන්න.",
                correct: ["while (X < 10) do", "begin", "X := X + 1;", "end;"],
                pool: ["while (X < 10) do", "begin", "X := X + 1;", "end;", "while X < 10 then", "X = X + 1;"]
            },
            {
                topic: "REPEAT-UNTIL පුනර්කරණය",
                mission: "අගය 0 වන තෙක් අවම වශයෙන් එක වරක් හෝ ධාවනය වන REPEAT ලූපයක් සාදන්න.",
                correct: ["repeat", "writeln(X);", "X := X - 1;", "until (X = 0);"],
                pool: ["repeat", "writeln(X);", "X := X - 1;", "until (X = 0);", "until X == 0;", "begin"]
            },
            {
                topic: "නියතයන් ප්‍රකාශ කිරීම (Constants)",
                mission: "PI සඳහා 3.14 ක ස්ථාවර නියත අගයක් (Constant) ප්‍රකාශ කරන්න.",
                correct: ["program ConstTest;", "const PI = 3.14;", "begin", "end."],
                pool: ["const PI = 3.14;", "begin", "end.", "program ConstTest;", "const PI := 3.14;"]
            },
            {
                topic: "බූලීය දත්ත වර්ග (Boolean)",
                mission: "සත්‍ය/අසත්‍ය (True/False) දත්ත සඳහා 'Status' නමින් විචල්‍යයක් ප්‍රකාශ කරන්න.",
                correct: ["program BoolTest;", "var Status: boolean;", "begin", "end."],
                pool: ["var Status: boolean;", "begin", "end.", "program BoolTest;", "var Status: binary;"]
            },
            {
                topic: "මොඩියුල ක්‍රියාකරු (MOD)",
                mission: "සංඛ්‍යාවක ඉතිරි අගය (Remainder) සෙවීමට MOD ක්‍රියාකරු භාවිත කර අගය පරීක්ෂා කරන්න.",
                correct: ["Remainder := Number mod 2;", "if Remainder = 0 then", "writeln('Even');"],
                pool: ["Remainder := Number mod 2;", "if Remainder = 0 then", "writeln('Even');", "Remainder = Number / 2;"]
            },
            {
                topic: "පූර්ණ සංඛ්‍යා බෙදීම (DIV)",
                mission: "දශම නොමැතිව පූර්ණ සංඛ්‍යාත්මක ඛණ්ඩය (Integer Division) සෙවීමට DIV භාවිත කරන ආකාරය පෙළගස්වන්න.",
                correct: ["Ans := 10 div 3;", "writeln(Ans);"],
                pool: ["Ans := 10 div 3;", "writeln(Ans);", "Ans := 10 / 3;", "writeln('Ans');"]
            },
            {
                topic: "FOR ලූපයකින් එකතුව සෙවීම",
                mission: "ලූපයක් ඇතුළතදී පවතින මුළු එකතුවට (Total) නව අගයන් එකතු කරගන්නා කේතය සකසන්න.",
                correct: ["Total := 0;", "for i := 1 to 5 do", "Total := Total + i;"],
                pool: ["Total := 0;", "for i := 1 to 5 do", "Total := Total + i;", "Total = Total + i;"]
            },
            {
                topic: "CASE තේරීම් ව්‍යුහය",
                mission: "විචල්‍යයක අගය අනුව එකවර තීරණ කිහිපයකින් එකක් තෝරන CASE ව්‍යුහය නිවැරදිව පෙළගස්වන්න.",
                correct: ["case Grade of", "'A' : writeln('Excellent');", "'B' : writeln('Good');", "end;"],
                pool: ["case Grade of", "'A' : writeln('Excellent');", "'B' : writeln('Good');", "end;", "case Grade then", "end."]
            },
            {
                topic: "සංකීර්ණ තාර්කික සම්බන්ධතා (AND)",
                mission: "ලකුණු 50 ට වැඩි 'සහ' පැමිණීම 80 ට වැඩි නම් පමණක් සුදුසුකම් ලබන (AND) කොන්දේසිය සකසන්න.",
                correct: ["if (Marks > 50) and (Attendance > 80) then", "writeln('Qualified');"],
                pool: ["if (Marks > 50) and (Attendance > 80) then", "writeln('Qualified');", "if (Marks > 50) & (Attendance > 80)", "writeln('Qualified')"]
            }
        ];

        let currentLevelIndex = 0;
        let userSelection = [];

        function loadLevel(index) {
            const lvl = pascalLevels[index];
            document.getElementById("topic-badge").innerText = `මාතෘකාව: ${lvl.topic}`;
            document.getElementById("level-indicator").innerText = `Level: ${index + 1} / 20`;
            document.getElementById("mission-text").innerText = lvl.mission;
            document.getElementById("feedback-msg").innerText = "";
            document.getElementById("feedback-msg").style.color = "";
            document.getElementById("next-level-btn").style.display = "none";
            
            userSelection = [];
            renderWorkspace();

            // Shuffle pool items
            let shuffledPool = [...lvl.pool].sort(() => Math.random() - 0.5);
            const poolEl = document.getElementById("pool");
            poolEl.innerHTML = "";

            shuffledPool.forEach(codeText => {
                const block = document.createElement("div");
                block.className = "code-block";
                block.innerText = codeText;
                block.onclick = () => blockClicked(codeText, block);
                poolEl.appendChild(block);
            });
        }

        function blockClicked(text, element) {
            userSelection.push(text);
            element.style.display = "none"; // Temporarily remove from selection pool
            renderWorkspace();
        }

        function renderWorkspace() {
            const slotsEl = document.getElementById("slots");
            slotsEl.innerHTML = "";

            if (userSelection.length === 0) {
                slotsEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:60px; font-size:0.85rem;">දකුණු පස ඇති Code Blocks නිවැරදි පිළිවෙළට ටැප් (Click) කරන්න.</p>';
                return;
            }

            userSelection.forEach((text, idx) => {
                const block = document.createElement("div");
                block.className = "code-block selected";
                block.innerText = text;
                block.onclick = () => removeBlock(idx);
                slotsEl.appendChild(block);
            });
        }

        function removeBlock(idx) {
            userSelection.splice(idx, 1);
            renderWorkspace();
            rebuildPool();
        }

        function rebuildPool() {
            const lvl = pascalLevels[currentLevelIndex];
            const poolEl = document.getElementById("pool");
            poolEl.innerHTML = "";

            lvl.pool.forEach(codeText => {
                // If it is not selected, show in pool
                if (!userSelection.includes(codeText)) {
                    const block = document.createElement("div");
                    block.className = "code-block";
                    block.innerText = codeText;
                    block.onclick = () => blockClicked(codeText, block);
                    poolEl.appendChild(block);
                }
            });
        }

        function compileCode() {
            const lvl = pascalLevels[currentLevelIndex];
            const feedback = document.getElementById("feedback-msg");

            if(userSelection.length === 0) {
                feedback.innerText = "⚠️ කරුණාකර කේත කොටස් එකතු කරන්න!";
                feedback.style.color = "var(--orange)";
                return;
            }

            let correct = userSelection.length === lvl.correct.length &&
                          userSelection.every((val, i) => val === lvl.correct[i]);

            if (correct) {
                feedback.innerText = "🎉 🌟 සාර්ථකයි! කේතය නිවැරදිව Run වුණා!";
                feedback.style.color = "var(--success)";
                document.getElementById("next-level-btn").style.display = "inline-block";
            } else {
                feedback.innerText = "❌ Syntax Error! කේතයේ පිළිවෙළ හෝ සංකේත වැරදියි. නැවත උත්සාහ කරන්න.";
                feedback.style.color = "var(--danger)";
            }
        }

        function resetLevel() {
            loadLevel(currentLevelIndex);
        }

        function goToNextLevel() {
            if (currentLevelIndex < pascalLevels.length - 1) {
                currentLevelIndex++;
                loadLevel(currentLevelIndex);
            } else {
                document.getElementById("feedback-msg").innerText = "🏆👑 සුභ පැතුම්! ඔබ සියලුම පියවර අවසන් කර මහා Pascal Alchemist කෙනෙක් වුණා!";
                document.getElementById("feedback-msg").style.color = "var(--gold)";
                currentLevelIndex = 0; // Loop back
            }
        }

        window.onload = () => loadLevel(0);
    </script>
</body>
</html>
